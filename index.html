<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Outlet performance</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1a1f2b;
    --muted: #5b6475;
    --border: #e1e5ec;
    --accent: #2f63c8;
    --accent-ink: #ffffff;
    --bar: #4c7fdc;
    --bad: #c62f2a;
    --bad-bg: #fdecea;
    --line: #6f788a;
    --shadow: 0 1px 2px rgba(20, 28, 45, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117;
      --surface: #171b24;
      --text: #e9ecf3;
      --muted: #9aa3b5;
      --border: #2a3040;
      --accent: #6b9bf0;
      --accent-ink: #0e1117;
      --bar: #6b9bf0;
      --bad: #f06b64;
      --bad-bg: #2b1a1b;
      --line: #8c95a8;
      --shadow: none;
      --on-bad: #0e1117;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }

  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--bad-bg); border: 1px solid var(--bad); color: var(--text); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 13.5px; }
  .banner b { color: var(--bad); }
  .banner .t { flex: 1 1 260px; }
  .banner button { font: inherit; font-size: 13px; padding: 7px 13px; min-height: 36px; border-radius: 8px; border: 1px solid var(--bad); background: transparent; color: var(--bad); font-weight: 600; cursor: pointer; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters button {
    font: inherit; font-size: 14px;
    padding: 8px 14px; min-height: 40px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text); cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .filters button:focus-visible, .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .kpi .note { color: var(--muted); font-size: 12.5px; }
  .kpi.warn .value { color: var(--bad); }

  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw.ok { background: var(--bar); }
  .sw.bad { background: var(--bad); }
  .sw.dash { width: 18px; height: 0; border-top: 2px dashed var(--line); border-radius: 0; }

  .chart { display: flex; position: relative; }
  .axis { flex: 0 0 auto; }
  .scroll { flex: 1 1 auto; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
  svg text { font-family: inherit; fill: var(--muted); }
  svg .grid { stroke: var(--border); stroke-width: 1; }
  svg .thr { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg .bar { fill: var(--bar); }
  svg .bar.bad { fill: var(--bad); }
  svg .bar:hover, svg .bar:focus { opacity: .8; outline: none; }
  svg .val { fill: var(--text); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  svg .val.bad { fill: var(--on-bad, #fff); font-weight: 700; }
  svg .grp { fill: var(--text); font-size: 12px; font-weight: 600; }
  svg .sep { stroke: var(--border); stroke-dasharray: 2 3; }
  .tip {
    position: absolute; z-index: 2; pointer-events: none; display: none;
    background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.35;
    padding: 6px 9px; border-radius: 6px; white-space: nowrap;
  }

  .attn { list-style: none; margin: 0; padding: 0; }
  .attn li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .attn li:first-child { border-top: 0; }
  .attn .who { font-weight: 600; }
  .attn .when { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .attn .pct { color: var(--bad); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .attn .detail { color: var(--muted); font-size: 13px; }
  .attn .gap { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 8px 0; }

  .status { text-align: center; padding: 56px 16px; }
  .status .msg { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .status .why { color: var(--muted); max-width: 560px; margin: 0 auto 14px; font-size: 14px; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .retry { font: inherit; padding: 9px 18px; min-height: 40px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi .value { font-size: 22px; }
    h1 { font-size: 20px; }
  }
  @media (max-width: 380px) {
    .wrap { padding: 16px 12px 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Outlet performance</h1>
    <div class="sub" id="updated" aria-live="polite"></div>
  </header>

  <div id="status" class="status card" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="msg">Loading sales data…</div>
    <div class="why">Fetching the latest figures from Google Sheets.</div>
  </div>

  <main id="app" hidden>
    <div class="banner" id="banner" hidden role="status">
      <div class="t"><b>Showing the bundled snapshot.</b> <span id="banner-why"></span></div>
      <button type="button" id="banner-retry">Try live data</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by outlet"></div>

    <section class="kpis" id="kpis" aria-label="Key figures"></section>

    <section class="card" style="margin-bottom:16px" aria-labelledby="chart-h">
      <h2 id="chart-h">Sales as % of target</h2>
      <p class="hint" id="chart-hint"></p>
      <div class="legend" aria-hidden="true">
        <span><i class="sw ok"></i>At or above threshold</span>
        <span><i class="sw bad"></i>Below threshold</span>
        <span><i class="sw dash"></i><b id="thr-label"></b></span>
      </div>
      <div class="chart" id="chart">
        <div class="axis" id="axis"></div>
        <div class="scroll" id="scroll" tabindex="0" role="region" aria-label="Chart, scrolls sideways"></div>
        <div class="tip" id="tip"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="attn-h">
      <h2 id="attn-h">Needs attention</h2>
      <p class="hint" id="attn-hint"></p>
      <ul class="attn" id="attn"></ul>
    </section>
  </main>
</div>

<script>
/* ===== Config ===== */
const CONFIG = {
  // The Google Sheet to read.
  SHEET_URL: "https://docs.google.com/spreadsheets/d/1nHamxOFPQAujHAb-0PcqvyqS6RxYo9JZo1OKR4kTAQE/edit?usp=sharing",

  // PRIMARY SOURCE: the Google Sheets API v4. Paste a Google API key here.
  // To make one: console.cloud.google.com > pick or create a project >
  //   1. APIs & Services > Library > "Google Sheets API" > Enable
  //   2. APIs & Services > Credentials > Create credentials > API key
  //   3. Edit the key > Application restrictions > Websites > add your Vercel domain
  //      (and http://localhost:* while testing) > API restrictions > Google Sheets API only
  // The sheet must also stay shared as "Anyone with the link can view" (it already is).
  // Note: a key in a web page is visible to visitors, so restrict it as in step 3. It only
  // ever grants read access to sheets that are already public.
  API_KEY: "",

  // OPTIONAL FALLBACK, tried only if the API call fails. Needs the tab published via
  // File > Share > Publish to web > Combined > CSV. Paste that "...output=csv" link here.
  PUBLISHED_CSV_URL: "",

  // Tab to read. Columns: outlet, week, sales, target, orders, returns
  TAB_NAME: "Combined",
  // Outlet-weeks below this share of target are flagged red and listed under "Needs attention".
  THRESHOLD: 0.9,
  CURRENCY_SYMBOL: "$",
  // If the live sheet can't be reached, show the bundled snapshot below with a warning banner.
  // Set to false to show an error instead.
  USE_SNAPSHOT: true
};

// Snapshot of the Combined tab, used only when the live sheet can't be reached.
const SNAPSHOT_CSV = `
outlet,week,sales,target,orders,returns
Jurong,2026-08-17,15500,15000,519,16
Jurong,2026-08-24,15100,15000,516,8
Jurong,2026-08-31,16000,15000,546,8
Jurong,2026-09-07,14200,15000,488,11
Jurong,2026-09-14,12600,15000,430,19
Jurong,2026-09-21,15300,15000,512,10
Jurong,2026-09-28,12900,15000,454,12
Jurong,2026-10-05,15500,15000,542,13
Jurong,2026-10-12,16100,15000,551,14
Orchard,2026-08-17,24900,24000,784,24
Orchard,2026-08-24,23500,24000,743,10
Orchard,2026-08-31,21500,24000,663,10
Orchard,2026-09-07,22500,24000,690,12
Orchard,2026-09-14,20100,24000,612,21
Orchard,2026-09-21,24800,24000,742,9
Orchard,2026-09-28,21500,24000,656,12
Orchard,2026-10-05,23800,24000,738,15
Orchard,2026-10-12,21400,24000,659,22
Tampines,2026-08-17,17900,18000,580,11
Tampines,2026-08-24,16100,18000,544,15
Tampines,2026-08-31,19000,18000,618,14
Tampines,2026-09-07,18400,18000,612,9
Tampines,2026-09-14,16100,18000,540,14
Tampines,2026-09-21,19200,18000,640,8
Tampines,2026-09-28,15200,18000,498,12
Tampines,2026-10-05,15200,18000,498,13
Tampines,2026-10-12,17500,18000,574,15
`;
/* ================== */

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let ROWS = [];
let selected = "All";

/* ---------- Loading ---------- */
function sheetId(url) {
  const m = String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// Google serves the same tab from several endpoints, and which one answers depends on how
// the sheet is published. Try them in order and keep the first that returns real CSV.
function sources() {
  const tab = encodeURIComponent(CONFIG.TAB_NAME);
  const id = sheetId(CONFIG.SHEET_URL);
  const list = [];
  if (id && CONFIG.API_KEY.trim()) list.push({
    kind: "api", label: "Sheets API",
    url: "https://sheets.googleapis.com/v4/spreadsheets/" + id + "/values/" + tab +
         "?key=" + encodeURIComponent(CONFIG.API_KEY.trim())
  });
  if (CONFIG.PUBLISHED_CSV_URL.trim()) list.push({ kind: "csv", label: "published CSV link", url: CONFIG.PUBLISHED_CSV_URL.trim() });
  if (id) {
    list.push({ kind: "csv", label: "gviz CSV", url: "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv&sheet=" + tab });
    list.push({ kind: "csv", label: "export CSV", url: "https://docs.google.com/spreadsheets/d/" + id + "/export?format=csv&sheet=" + tab });
  }
  return list;
}

// Sheets API v4: returns {range, majorDimension, values:[[...]]}, and a JSON error object
// with a useful message when something is wrong with the key, the API or the range.
async function fetchApi(src) {
  let res;
  try { res = await fetch(src.url, { cache: "no-store" }); }
  catch (e) { throw new Error(BLOCKED); }
  let body;
  try { body = await res.json(); }
  catch (e) { throw new Error("HTTP " + res.status + ", and the reply was not JSON"); }
  if (!res.ok) throw new Error("Google says: " + ((body && body.error && body.error.message) || ("HTTP " + res.status)));
  if (!body.values || !body.values.length) throw new Error("no values returned for range “" + CONFIG.TAB_NAME + "”");
  return rowsFromGrid(body.values);
}

const BLOCKED = "blocked before any reply (CORS or no network)";

async function fetchCsv(src) {
  let res;
  try { res = await fetch(src.url, { cache: "no-store" }); }
  catch (e) { throw new Error(BLOCKED); }
  if (!res.ok) throw new Error("HTTP " + res.status + (res.status === 404 ? " (tab “" + CONFIG.TAB_NAME + "” not found?)" : ""));
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error("returned a sign-in or error page, not CSV");
  return parseRows(text);
}

async function loadLive() {
  const list = sources();
  if (!list.length) { const e = new Error("no source"); e.failures = [{ label: "config", reason: "CONFIG has neither a published CSV link nor a valid Google Sheets link." }]; throw e; }
  const failures = [];
  for (const src of list) {
    try { return { rows: await (src.kind === "api" ? fetchApi(src) : fetchCsv(src)), label: src.label }; }
    catch (e) { failures.push({ label: src.label, reason: e.message }); }
  }
  const err = new Error("all sources failed");
  err.failures = failures;
  throw err;
}

// Turn the collected failures into one sentence the reader can act on.
function diagnose(failures) {
  if (location.protocol === "file:") {
    return "This page is open straight from your computer (a file:// address), and browsers block data requests from local files. Deploy it to Vercel, or serve the folder over http://localhost, and it will load.";
  }
  const api = failures.find(f => f.label === "Sheets API");
  if (api) {
    const r = api.reason;
    if (/API key not valid|API_KEY_INVALID|key expired/i.test(r))
      return "Google rejected the API key. Check CONFIG.API_KEY for a typo, and that the key is still active in Google Cloud Console ▸ APIs & Services ▸ Credentials.";
    if (/has not been used|SERVICE_DISABLED|is disabled/i.test(r))
      return "The Google Sheets API is not switched on for that key's project. Open Google Cloud Console ▸ APIs & Services ▸ Library, search for “Google Sheets API” and click Enable, then wait a minute and retry.";
    if (/referer|referrer|blocked|API_KEY_HTTP_REFERRER/i.test(r))
      return "The API key is restricted to other websites. In Google Cloud Console ▸ Credentials, open the key and add this site under Application restrictions ▸ Websites.";
    if (/PERMISSION_DENIED|does not have permission|insufficient/i.test(r))
      return "The key was accepted but Google refused this sheet. An API key can only read a sheet shared as “Anyone with the link can view”, so check the sheet's Share setting.";
    if (/Unable to parse range|Requested entity was not found|not found/i.test(r))
      return "The tab “" + CONFIG.TAB_NAME + "” was not found in that spreadsheet. Check TAB_NAME and SHEET_URL at the top of the script.";
    if (r === BLOCKED)
      return "The browser could not reach the Google Sheets API at all. Check the connection, and any blocker or network that might stop requests to sheets.googleapis.com.";
    return "The Google Sheets API call failed. " + r;
  }
  if (!CONFIG.API_KEY.trim()) {
    return "No Google API key is set, so the dashboard fell back to the CSV links, which Google blocks for a sheet that is not published. Add a key to CONFIG.API_KEY at the top of this file's script; the comment there has the steps.";
  }
  if (failures.some(f => f.reason === BLOCKED)) {
    return "Google refused the request from the browser. Sharing the sheet by link is not enough on its own: open the sheet, choose File ▸ Share ▸ Publish to web, pick the “" + CONFIG.TAB_NAME + "” tab and CSV, publish, then paste that link into PUBLISHED_CSV_URL at the top of this file's script.";
  }
  if (failures.some(f => /sign-in/.test(f.reason))) {
    return "Google answered with a sign-in page instead of data. Publish the “" + CONFIG.TAB_NAME + "” tab with File ▸ Share ▸ Publish to web ▸ CSV, then paste that link into PUBLISHED_CSV_URL.";
  }
  return "The sheet could not be read.";
}

const detail = failures => failures.map(f => f.label + ": " + f.reason).join(" · ");

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const num = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : NaN; };

function parseWeek(s) {
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  const d = new Date(s + " UTC");
  return isNaN(d) ? null : d;
}

const parseRows = text => rowsFromGrid(parseCSV(text));

// Accepts both the CSV grid and the Sheets API's "values" array (cells may be numbers).
function rowsFromGrid(raw) {
  const cell = v => (v === null || v === undefined ? "" : String(v));
  const grid = (raw || []).map(r => (r || []).map(cell)).filter(r => r.some(c => c.trim() !== ""));
  if (grid.length < 2) throw new Error("The “" + CONFIG.TAB_NAME + "” tab has no data rows.");
  const head = grid[0].map(h => h.trim().toLowerCase());
  const need = ["outlet", "week", "sales", "target", "orders", "returns"];
  const idx = {};
  for (const k of need) {
    idx[k] = head.indexOf(k);
    if (idx[k] < 0) throw new Error("Column “" + k + "” not found in the “" + CONFIG.TAB_NAME + "” tab. Found: " + grid[0].join(", ") + ".");
  }
  const out = [];
  for (const r of grid.slice(1)) {
    const o = {
      outlet: (r[idx.outlet] || "").trim(),
      weekRaw: (r[idx.week] || "").trim(),
      sales: num(r[idx.sales]), target: num(r[idx.target]),
      orders: num(r[idx.orders]), returns: num(r[idx.returns])
    };
    if (!o.outlet || isNaN(o.sales) || isNaN(o.target) || o.target <= 0) continue;
    o.orders = isNaN(o.orders) ? 0 : o.orders;
    o.returns = isNaN(o.returns) ? 0 : o.returns;
    o.date = parseWeek(o.weekRaw);
    o.pct = o.sales / o.target;
    out.push(o);
  }
  if (!out.length) throw new Error("No usable rows found in the “" + CONFIG.TAB_NAME + "” tab.");
  return out;
}

/* ---------- Formatting ---------- */
const money = n => CONFIG.CURRENCY_SYMBOL + Math.round(n).toLocaleString("en-SG");
const int = n => Math.round(n).toLocaleString("en-SG");
const pct0 = x => Math.round(x * 100) + "%";
const pct1 = x => (x * 100).toFixed(1) + "%";
const weekLabel = r => r.date ? r.date.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : r.weekRaw;
const weekLong = r => r.date ? r.date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : r.weekRaw;

/* ---------- Rendering ---------- */
function visible() {
  const rows = selected === "All" ? ROWS : ROWS.filter(r => r.outlet === selected);
  return rows.slice().sort((a, b) =>
    (selected === "All" ? ROWS.findIndex(x => x.outlet === a.outlet) - ROWS.findIndex(x => x.outlet === b.outlet) : 0) ||
    ((a.date || 0) - (b.date || 0)));
}

function renderFilters() {
  const names = ["All", ...new Set(ROWS.map(r => r.outlet))];
  const box = $("filters"); box.textContent = "";
  for (const n of names) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    b.setAttribute("aria-pressed", String(n === selected));
    b.onclick = () => { selected = n; renderFilters(); renderAll(); };
    box.appendChild(b);
  }
}

function renderKpis(rows) {
  const s = rows.reduce((a, r) => (a.sales += r.sales, a.target += r.target, a.orders += r.orders, a.returns += r.returns, a), { sales: 0, target: 0, orders: 0, returns: 0 });
  const p = s.sales / s.target, rp = s.orders ? s.returns / s.orders : 0;
  const under = rows.filter(r => r.pct < CONFIG.THRESHOLD).length;
  const cards = [
    ["Total sales", money(s.sales), "across " + rows.length + " outlet-week" + (rows.length === 1 ? "" : "s"), false],
    ["% of target", pct1(p), money(s.sales - s.target).replace(CONFIG.CURRENCY_SYMBOL + "-", "-" + CONFIG.CURRENCY_SYMBOL) + " vs " + money(s.target) + " target", p < CONFIG.THRESHOLD],
    ["Orders", int(s.orders), s.orders ? "average order " + CONFIG.CURRENCY_SYMBOL + (s.sales / s.orders).toFixed(2) : "", false],
    ["Returns %", pct1(rp), int(s.returns) + " returns", false]
  ];
  const box = $("kpis"); box.textContent = "";
  for (const [l, v, n, warn] of cards) {
    const d = document.createElement("div"); d.className = "card kpi" + (warn ? " warn" : "");
    d.innerHTML = '<div class="label"></div><div class="value"></div><div class="note"></div>';
    d.children[0].textContent = l; d.children[1].textContent = v; d.children[2].textContent = n;
    box.appendChild(d);
  }
}

function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function renderChart(rows) {
  const T = CONFIG.THRESHOLD;
  $("thr-label").textContent = pct0(T) + " of target";
  $("chart-hint").textContent = "One bar per outlet-week. " + (rows.length > 12 ? "Scroll sideways to see every week." : "");
  const H = 280, top = 22, bottom = 58, plotH = H - top - bottom;
  const BW = 34, GAP = 8, GGAP = 22, left = 6;
  const maxPct = Math.max(1.2, Math.ceil(Math.max(...rows.map(r => r.pct)) * 10) / 10 + 0.05);
  const yMax = Math.ceil(maxPct * 5) / 5;
  const y = v => top + plotH - (v / yMax) * plotH;

  // group by outlet
  const groups = [];
  for (const r of rows) {
    let g = groups[groups.length - 1];
    if (!g || g.name !== r.outlet) { g = { name: r.outlet, rows: [] }; groups.push(g); }
    g.rows.push(r);
  }
  let x = left; const pos = [];
  groups.forEach((g, gi) => {
    if (gi) x += GGAP;
    g.x0 = x;
    g.rows.forEach(r => { pos.push([r, x]); x += BW + GAP; });
    g.x1 = x - GAP;
  });
  const W = x + left;

  // y axis (fixed, outside scroll area)
  const ax = el("svg", { width: 44, height: H, "aria-hidden": "true" });
  const ticks = [];
  for (let v = 0; v <= yMax + 1e-9; v += 0.2) ticks.push(v);
  for (const v of ticks) ax.appendChild(el("text", { x: 38, y: y(v) + 4, "text-anchor": "end", "font-size": 11 }, pct0(v)));
  const at = el("text", { x: 38, y: y(T) + 4, "text-anchor": "end", "font-size": 11, "font-weight": 700 }, "");
  at.setAttribute("style", "fill:var(--text)");
  // draw the threshold tick label only if it doesn't collide with a regular tick
  const clash = ticks.some(v => Math.abs(y(v) - y(T)) < 11);
  if (!clash) { at.textContent = pct0(T); ax.appendChild(at); }
  $("axis").textContent = ""; $("axis").appendChild(ax);

  // plot
  const svg = el("svg", { width: W, height: H, role: "img", "aria-label": "Bar chart of sales as a percentage of target for each outlet-week" });
  for (const v of ticks) svg.appendChild(el("line", { class: "grid", x1: 0, x2: W, y1: y(v), y2: y(v) }));
  groups.forEach((g, gi) => {
    if (gi) { const sx = g.x0 - GGAP / 2 - GAP / 2 + GAP / 2; svg.appendChild(el("line", { class: "sep", x1: sx, x2: sx, y1: top, y2: H - 6 })); }
  });
  const tip = $("tip");
  for (const [r, bx] of pos) {
    const bad = r.pct < T, h = Math.max(1, plotH - (y(r.pct) - top));
    const label = r.outlet + ", week of " + weekLong(r) + ": " + pct1(r.pct) + " of target (" + money(r.sales) + " vs " + money(r.target) + ")" + (bad ? ", below threshold" : "");
    const bar = el("rect", { class: "bar" + (bad ? " bad" : ""), x: bx, y: y(r.pct), width: BW, height: h, rx: 3, tabindex: 0, role: "img", "aria-label": label });
    const show = ev => {
      tip.innerHTML = ""; const a = document.createElement("b"); a.textContent = r.outlet + " · " + weekLong(r);
      tip.append(a, document.createElement("br"), pct1(r.pct) + " of target", document.createElement("br"), money(r.sales) + " / " + money(r.target));
      tip.style.display = "block";
      const cr = $("chart").getBoundingClientRect(), br = bar.getBoundingClientRect();
      let lx = br.left - cr.left + br.width / 2 - tip.offsetWidth / 2;
      lx = Math.max(0, Math.min(cr.width - tip.offsetWidth, lx));
      tip.style.left = lx + "px";
      tip.style.top = Math.max(0, br.top - cr.top - tip.offsetHeight - 6) + "px";
    };
    bar.addEventListener("pointerenter", show);
    bar.addEventListener("focus", show);
    bar.addEventListener("click", show);
    bar.addEventListener("pointerleave", () => tip.style.display = "none");
    bar.addEventListener("blur", () => tip.style.display = "none");
    svg.appendChild(bar);
    svg.appendChild(el("text", { class: "val" + (bad ? " bad" : ""), x: bx + BW / 2, y: bad ? y(r.pct) + 14 : y(r.pct) - 4, "text-anchor": "middle" }, pct1(r.pct).replace(/\.0%$/, "%")));
    svg.appendChild(el("text", { x: bx + BW / 2, y: H - bottom + 16, "text-anchor": "middle", "font-size": 10.5 }, weekLabel(r)));
  }
  svg.appendChild(el("line", { class: "thr", x1: 0, x2: W, y1: y(T), y2: y(T) }));
  groups.forEach(g => svg.appendChild(el("text", { class: "grp", x: (g.x0 + g.x1) / 2, y: H - 10, "text-anchor": "middle" }, g.name)));
  const sc = $("scroll"); sc.textContent = ""; sc.appendChild(svg);
  sc.onscroll = () => tip.style.display = "none";
}

function renderAttention(rows) {
  const T = CONFIG.THRESHOLD;
  const list = rows.filter(r => r.pct < T).sort((a, b) => a.pct - b.pct);
  $("attn-hint").textContent = list.length
    ? list.length + " of " + rows.length + " outlet-weeks are below " + pct0(T) + " of target, worst first."
    : "";
  const ul = $("attn"); ul.textContent = "";
  if (!list.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "Nothing below " + pct0(T) + " of target" + (selected === "All" ? "." : " for " + selected + ".");
    ul.appendChild(li); return;
  }
  for (const r of list) {
    const li = document.createElement("li");
    li.innerHTML = '<div><span class="who"></span><span class="when"></span></div><div class="pct"></div><div class="detail"></div><div class="gap"></div>';
    li.querySelector(".who").textContent = r.outlet + " ";
    li.querySelector(".when").textContent = "week of " + weekLong(r);
    li.querySelector(".pct").textContent = pct1(r.pct);
    li.querySelector(".detail").textContent = money(r.sales) + " vs " + money(r.target) + " target";
    li.querySelector(".gap").textContent = "short by " + money(r.target - r.sales);
    ul.appendChild(li);
  }
}

function renderAll() {
  const rows = visible();
  renderKpis(rows); renderChart(rows); renderAttention(rows);
}

/* ---------- Start ---------- */
function showError(failures) {
  const s = $("status"); s.hidden = false; $("app").hidden = true;
  s.innerHTML = '<div class="msg">Couldn’t load the sales data</div><div class="why"></div><button class="retry" type="button">Try again</button><div class="why" style="margin-top:12px;font-size:12.5px"></div>';
  s.querySelectorAll(".why")[0].textContent = diagnose(failures);
  s.querySelectorAll(".why")[1].textContent = detail(failures);
  s.querySelector(".retry").onclick = start;
}

function show(rows, sourceLabel, warning) {
  ROWS = rows;
  if (selected !== "All" && !ROWS.some(r => r.outlet === selected)) selected = "All";
  $("status").hidden = true; $("app").hidden = false;
  const b = $("banner");
  if (warning) { b.hidden = false; $("banner-why").textContent = warning; }
  else b.hidden = true;
  renderFilters(); renderAll();
  $("updated").textContent = warning
    ? "Snapshot data · tab “" + CONFIG.TAB_NAME + "”"
    : "Updated " + new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" }) + " · " + sourceLabel + " · tab “" + CONFIG.TAB_NAME + "”";
}

async function start() {
  const s = $("status"); s.hidden = false; $("app").hidden = true;
  s.innerHTML = '<div class="spinner" aria-hidden="true"></div><div class="msg">Loading sales data…</div><div class="why">Fetching the latest figures from Google Sheets.</div>';
  let failures;
  try {
    const live = await loadLive();
    show(live.rows, live.label, null);
    return;
  } catch (e) { failures = e.failures || [{ label: "load", reason: e.message || String(e) }]; }

  if (CONFIG.USE_SNAPSHOT && SNAPSHOT_CSV.trim()) {
    try { show(parseRows(SNAPSHOT_CSV), "snapshot", diagnose(failures)); return; }
    catch (e) { /* fall through to the error screen */ }
  }
  showError(failures);
}
document.getElementById("banner-retry").onclick = start;
start();
</script>
